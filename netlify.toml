# Configuración de Despliegue de Producción para Netlify
# Nutribarrio v1.0.2 Pro
# Desarrollado por: Ing. Joel Roldán Gómez

[build]
  command = "npm run build"
  publish = "dist"

# Redirecciones para Progressive Web App (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de Seguridad y Caché para PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
